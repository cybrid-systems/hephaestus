# Structure always; full denseness when Aura can be built (org image).
name: denseness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structure checks
        run: bash ./scripts/check-structure.sh

  denseness:
    runs-on: ubuntu-latest
    needs: structure
    timeout-minutes: 120
    container:
      image: ghcr.io/cybrid-systems/dev:v1.0.5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout hephaestus
        uses: actions/checkout@v4
        with:
          path: hephaestus

      - name: Checkout aura
        uses: actions/checkout@v4
        with:
          repository: cybrid-systems/aura
          path: aura
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Aura Python CI deps
        working-directory: aura
        run: |
          set -euo pipefail
          if [[ -f requirements-dev.txt ]]; then
            pip install --break-system-packages -r requirements-dev.txt \
              || pip install -r requirements-dev.txt
          fi

      - name: Build Aura binary
        working-directory: aura
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          set -euo pipefail
          cmake -B build -G Ninja -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPERIMENTAL_CXX_IMPORT_STD=f35a9ac6-8463-4d38-8eec-5d6008153e7d
          cmake --build build --target aura -j"${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Run denseness suite
        working-directory: hephaestus
        env:
          AURA_BIN: ${{ github.workspace }}/aura/build/aura
          AURA_LIB: ${{ github.workspace }}/aura/lib
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash ./scripts/check-structure.sh
          bash ./scripts/run-all.sh
